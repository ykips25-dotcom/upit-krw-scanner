<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사부 차트 비기 — Upbit KRW 스캐너</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background: #080b10;
      color: #e5e7eb;
    }

    .card {
      background: #11161d;
      border: 1px solid #27303b;
    }

    .muted {
      color: #8b96a5;
    }

    .pill {
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
    }
  </style>
</head>

<body class="min-h-screen">

<header class="border-b border-slate-800 bg-slate-950/90 sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-4 py-4">

    <div class="flex items-center justify-between gap-3">

      <div>
        <h1 class="text-xl font-bold">
          사부 차트 비기
        </h1>

        <p class="text-sm muted">
          Upbit KRW 실데이터 후보 스캐너
        </p>
      </div>

      <div id="api" class="pill">
        API 확인 중…
      </div>

    </div>

  </div>
</header>

<main class="max-w-6xl mx-auto p-4">

  <section class="card rounded-xl p-4 mb-4">

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">

      <label class="text-sm">
        최소 24h 거래대금

        <select
          id="minVol"
          class="mt-1 w-full bg-slate-900 border border-slate-700 rounded p-2"
        >
          <option value="10">10억</option>
          <option value="30" selected>30억</option>
          <option value="50">50억</option>
          <option value="100">100억</option>
        </select>
      </label>

      <label class="text-sm">
        후보 수

        <select
          id="limit"
          class="mt-1 w-full bg-slate-900 border border-slate-700 rounded p-2"
        >
          <option>5</option>
          <option selected>10</option>
          <option>20</option>
        </select>
      </label>

      <div class="text-sm">
        마지막 스캔

        <div
          id="time"
          class="mt-1 font-semibold"
        >
          -
        </div>
      </div>

      <div class="text-sm">
        분석 종목

        <div
          id="count"
          class="mt-1 font-semibold"
        >
          -
        </div>
      </div>

    </div>

    <div class="flex gap-2 mt-4">

      <button
        id="scan"
        class="bg-white text-black font-semibold rounded px-4 py-2"
      >
        스캔 시작
      </button>

      <label class="flex items-center gap-2 text-sm">

        <input
          id="auto"
          type="checkbox"
        >

        5분 자동 새로고침

      </label>

    </div>

  </section>

  <section
    id="list"
    class="grid gap-3"
  ></section>

</main>

<div
  id="modal"
  class="hidden fixed inset-0 bg-black/70 p-4 z-20 overflow-auto"
>

  <div
    class="max-w-5xl mx-auto card rounded-xl p-4 mt-6"
  >

    <div class="flex justify-between items-center mb-3">

      <h2
        id="modalTitle"
        class="text-lg font-bold"
      ></h2>

      <button
        onclick="closeModal()"
        class="pill"
      >
        닫기
      </button>

    </div>

    <div id="modalBody"></div>

    <canvas
      id="chart"
      class="mt-4"
    ></canvas>

  </div>

</div>

<script>

let chart;
let lastResults = [];

function won(n) {

  if (n == null) {
    return "미확인";
  }

  return new Intl.NumberFormat("ko-KR")
    .format(Math.round(n)) + "원";
}

function pct(n) {

  if (n == null) {
    return "미확인";
  }

  return Number(n).toFixed(2) + "%";
}

function statusPill(s) {

  const cls =
    s === "진입 가능"
      ? "text-green-300 border-green-700"
      : s === "조건부"
      ? "text-yellow-300 border-yellow-700"
      : "text-red-300 border-red-700";

  return `
    <span class="pill ${cls}">
      ${s || "미확인"}
    </span>
  `;
}

async function health() {

  try {

    const r = await fetch("/api/health");

    const j = await r.json();

    document.querySelector("#api").textContent =
      j.ok
        ? "● API 정상"
        : "● API 오류";

    document.querySelector("#api").className =
      "pill " +
      (
        j.ok
          ? "text-green-300 border-green-700"
          : "text-red-300 border-red-700"
      );

  } catch (e) {

    document.querySelector("#api").textContent =
      "● API 오류";

  }

}

async function scan() {

  const btn =
    document.querySelector("#scan");

  btn.disabled = true;
  btn.textContent = "스캔 중…";

  document.querySelector("#list").innerHTML = `
    <div class="card rounded-xl p-5 muted">
      Upbit 실데이터 수집 및 분석 중…
    </div>
  `;

  try {

    const minVol =
      document.querySelector("#minVol").value;

    const limit =
      document.querySelector("#limit").value;

    const r = await fetch(
      `/api/scan?minVol=${minVol}&limit=${limit}`
    );

    const j = await r.json();

    if (!j.ok) {
      throw new Error(
        j.error || "오류"
      );
    }

    lastResults = j.results;

    document.querySelector("#time").textContent =
      new Date(
        j.timestamp
      ).toLocaleString("ko-KR");

    document.querySelector("#count").textContent =
      j.scanned;

    render(j.results);

  } catch (e) {

    document.querySelector("#list").innerHTML = `
      <div class="card rounded-xl p-5 text-red-300">
        ${e.message}
      </div>
    `;

  } finally {

    btn.disabled = false;
    btn.textContent = "스캔 시작";

  }

}

function render(rows) {

  const list =
    document.querySelector("#list");

  list.innerHTML =
    rows.map((x, i) => `

      <button
        onclick="openModal(${i})"
        class="card rounded-xl p-4 text-left w-full hover:border-slate-500"
      >

        <div class="flex justify-between gap-3">

          <div>

            <div class="font-bold">

              ${x.name}

              <span class="muted text-xs">
                ${x.market}
              </span>

            </div>

            <div class="mt-2 text-lg">
              ${won(x.currentPrice)}
            </div>

            <div
              class="text-sm ${
                x.changeRate >= 0
                  ? "text-green-300"
                  : "text-red-300"
              }"
            >

              ${pct(x.changeRate)}

              · 24h 거래대금

              ${won(x.tradeValue24h)}

            </div>

          </div>

          <div class="text-right">

            ${statusPill(x.finalState)}

            <div class="mt-2 text-sm muted">

              등급
              ${x.grade || "미확인"}

            </div>

          </div>

        </div>

        <div class="flex flex-wrap gap-2 mt-3 text-xs">

          <span class="pill">
            ${x.structure || "구조 미확인"}
          </span>

          <span class="pill">

            20SMA 이격
            ${pct(x.deviation20)}

          </span>

          <span class="pill">

            R/R

            ${
              x.rr == null
                ? "미확인"
                : Number(x.rr).toFixed(2)
            }

          </span>

        </div>

      </button>

    `).join("");

}

function openModal(i) {

  const x = lastResults[i];

  document
    .querySelector("#modal")
    .classList.remove("hidden");

  document.querySelector("#modalTitle").textContent =
    `${x.name} (${x.market})`;

  document.querySelector("#modalBody").innerHTML = `

    <div
      class="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm"
    >

      <div class="card rounded p-3">
        판정<br>
        <b>
          ${x.finalState || "미확인"}
        </b>
      </div>

      <div class="card rounded p-3">
        등급<br>
        <b>
          ${x.grade || "미확인"}
        </b>
      </div>

      <div class="card rounded p-3">
        구조<br>
        <b>
          ${x.structure || "미확인"}
        </b>
      </div>

      <div class="card rounded p-3">
        R/R<br>
        <b>
          ${
            x.rr == null
              ? "미확인"
              : Number(x.rr).toFixed(2)
          }
        </b>
      </div>

      <div class="card rounded p-3">
        진입 관찰가<br>
        <b>
          ${won(x.price)}
        </b>
      </div>

      <div class="card rounded p-3">
        무효화<br>
        <b>
          ${won(x.invalidation)}
        </b>
      </div>

      <div class="card rounded p-3">
        실제 저항 목표<br>
        <b>
          ${won(x.target)}
        </b>
      </div>

      <div class="card rounded p-3">
        ATR14<br>
        <b>
          ${won(x.atr14)}
        </b>
      </div>

    </div>

    <div
      class="mt-4 grid grid-cols-5 gap-2 text-center text-xs"
    >

      ${
        Object.entries(x.gStatus || {})
          .map(
            ([k, v]) => `
              <div class="card rounded p-2">
                ${k}<br>
                <b>${v}</b>
              </div>
            `
          )
          .join("")
      }

    </div>

    <div class="mt-4 text-xs muted">

      주의: 현재 버전은 1시간봉 중심의
      실데이터 스캐너입니다.

      데이터가 확인되지 않는 조건은
      임의로 채우지 않고 미확인으로 표시합니다.

    </div>

  `;

  drawChart(x);

}

function drawChart(x) {

  if (chart) {
    chart.destroy();
  }

  const labels =
    x.candles.map(
      c =>
        new Date(c.time)
          .toLocaleTimeString(
            "ko-KR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
    );

  chart = new Chart(
    document.querySelector("#chart"),
    {

      type: "line",

      data: {

        labels,

        datasets: [

          {
            label: "Close",
            data: x.candles.map(c => c.close),
            borderWidth: 2,
            pointRadius: 0
          },

          {
            label: "10SMA",
            data: x.candles.map(c => c.sma10),
            borderWidth: 1,
            pointRadius: 0
          },

          {
            label: "20SMA",
            data: x.candles.map(c => c.sma20),
            borderWidth: 1,
            pointRadius: 0
          },

          {
            label: "240SMA",
            data: x.candles.map(c => c.sma240),
            borderWidth: 1,
            pointRadius: 0
          }

        ]

      },

      options: {

        responsive: true,

        interaction: {
          mode: "index",
          intersect: false
        },

        plugins: {

          legend: {
            labels: {
              color: "#e5e7eb"
            }
          }

        },

        scales: {

          x: {
            ticks: {
              color: "#8b96a5"
            }
          },

          y: {
            ticks: {
              color: "#8b96a5"
            }
          }

        }

      }

    }
  );

}

function closeModal() {

  document
    .querySelector("#modal")
    .classList.add("hidden");

}

document
  .querySelector("#scan")
  .addEventListener(
    "click",
    scan
  );

document
  .querySelector("#auto")
  .addEventListener(
    "change",
    e => {

      if (e.target.checked) {

        window._timer =
          setInterval(
            scan,
            300000
          );

      } else {

        clearInterval(
          window._timer
        );

      }

    }
  );

health();
scan();

</script>

</body>
</html>
